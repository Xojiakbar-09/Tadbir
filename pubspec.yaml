name: tadbir_go
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  go_router: ^18.1.1
  hive_ce: ^2.22.0
  easy_localization: ^3.0.8
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  intl: ^0.20.2
  hive_ce_flutter: ^2.5.0
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.3
  shimmer: ^4.0.0
  ios26_bottom_navigationbar: ^0.0.4
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  hive_ce_generator: ^1.11.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/
    - assets/icons/

  generate: true



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/tadbir_go_logo.png"
  remove_alpha_ios: true
